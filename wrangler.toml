name = "mathify"
compatibility_date = "2026-06-01"
pages_build_output_dir = "public"

# Database. After `npx wrangler d1 create mathify`, paste the database_id it prints here.
[[d1_databases]]
binding = "DB"
database_name = "mathify"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# Comma-separated Google emails that get the admin dashboard.
ADMIN_EMAILS = "tanmaym88@gmail.com"
# WhatsApp number used on invoices / reminders (digits only, with country code).
BUSINESS_WHATSAPP = "919766072237"
BUSINESS_EMAIL = "tanmaym88@gmail.com"

# Secrets (NOT in this file). Set them in Cloudflare → Pages → Settings → Variables and secrets,
# or locally in .dev.vars:
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   SESSION_SECRET   (any long random string)
