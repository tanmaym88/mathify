<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mathify</title>
  <meta name="description" content="Mathify — one-to-one Maths coaching by Tanmay Mogra (IIT alumnus, JEE AIR 328). Online worldwide and offline in Magarpatta, Pune.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mathify">
  <meta property="og:title" content="Mathify">
  <meta property="og:description" content="Mathify — one-to-one Maths coaching by Tanmay Mogra (IIT alumnus, JEE AIR 328). Online worldwide and offline in Magarpatta, Pune.">
  <meta property="og:url" content="https://mathify.world/">
  <meta property="og:image" content="https://mathify.world/brand/mathify-share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/assets/favicon.svg?v=16efd5404c" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=fecb1bcb3d">
  <link rel="preload" href="/images/5cats.webp?v=93c4812e6f" as="image">
  <style>
    html, body { margin: 0; }
    body { background: #fff; }
    #cop { --ink:#1f2a37; --card:#fff; --accent:#2f3192; --good:#1a9b5b; --bad:#d9534f; --slot:#fff6d6; --size:136px;
           font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--ink); width: 100%; }
    @media (max-width: 600px) {
      #cop { --size:72px; }
      #cop #cop-stage { padding: 4px 12px 24px; }
      #cop #cop-scatter { height: clamp(230px, calc(100svh - 440px), 420px); }
      #cop h1.cop-title { margin: 2px 12px 0; font-size: 1.12rem; }
      #cop p.cop-skipline { margin: 2px 12px 6px; font-size: .92rem; }
      #cop #cop-slots { grid-template-columns: repeat(3, calc(var(--size) + 8px)); justify-content: center; gap: 8px; margin-top: 12px; }
      #cop div.cop-bar { padding: 4px 12px; margin-bottom: 8px; }
      #cop .cop-slot:nth-child(3n) .cop-arrow { display: none; }
    }
    #cop * { box-sizing: border-box; }
    #cop-msg { min-height: 1.4em; font-weight: 600; }
    #cop-msg.bad { color: var(--bad); }
    #cop-stage { position: relative; max-width: 1100px; margin: 0 auto; padding: 8px 16px 32px; user-select: none; -webkit-user-select: none; }
    #cop-scatter { position: relative; height: 520px; border: 2px dashed #cfc6b3; border-radius: 16px; background: #fbf9f4; }
    #cop-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--size) + 8px), 1fr)); gap: 10px; margin-top: 16px; }
    #cop .cop-slot { height: calc(var(--size) + 8px); border-radius: 14px; background: var(--slot); border: 2px dashed #e6b422; position: relative; transition: background .15s; }
    #cop .cop-slot.hover { background: #e4e5f6; border-color: var(--accent); }
    #cop .cop-arrow { position: absolute; top: 50%; right: -9px; transform: translateY(-50%); font-size: 12px; color: #f7941d; }
    #cop .cop-card { position: absolute; left: 0; top: 0; width: var(--size); height: var(--size); background: var(--card); border-radius: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,.15); display: grid; align-content: center; justify-content: center;
            gap: 3px; padding: 6px; cursor: grab; z-index: 1; overflow: hidden; touch-action: none; }
    #cop .cop-card img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 4px; display: block;
            pointer-events: none; -webkit-user-drag: none; user-select: none; }
    #cop .cop-card.single img { aspect-ratio: auto; height: 100%; object-fit: contain; }
    #cop .cop-card.single { padding: 4px; }
    #cop .cop-card.snap { transition: left .2s, top .2s; }
    #cop .cop-card.dragging { cursor: grabbing; box-shadow: 0 12px 26px rgba(0,0,0,.25); z-index: 1000; transform: scale(1.06); }
    #cop .cop-card.wrong { animation: cop-shake .45s; outline: 2px solid var(--bad); }
    @keyframes cop-shake { 0%,100%{translate:0} 20%{translate:-6px} 40%{translate:6px} 60%{translate:-4px} 80%{translate:4px} }
    #cop .cop-bar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 6px max(16px, calc((100% - 1100px) / 2 + 16px)); margin: 0 0 12px; flex-wrap: wrap; background: #ffd54f; box-shadow: 0 1px 0 rgba(0,0,0,.08); }
    .cop-icon { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--accent, #2f3192); color: #fff;
         font-size: 24px; line-height: 48px; text-align: center; text-decoration: none; cursor: pointer; display: inline-block; padding: 0; margin: 4px; }
    .cop-icon:hover { filter: brightness(1.1); }
    #cop .cop-skip { display: none; }
    #cop .cop-skipline { margin: 0 16px 8px; text-align: center; font: 700 .98rem Lato, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #cop .cop-skipline a { color: #2f3192; text-decoration: underline; text-decoration-color: #f7941d; text-decoration-thickness: 2px; text-underline-offset: 3px; }
    #cop .cop-login { background: #2f3192; color: #fff; font-weight: 700; text-decoration: none; padding: 9px 16px; border-radius: 8px; font-family: Lato, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 1rem; line-height: 1.2; }
    #cop .cop-login:hover { background: #22246e; }
    #cop .cop-title { margin: 4px 16px 6px; text-align: center; color: #2f3192; font-weight: 900; font-size: clamp(1.15rem, 3.2vw, 1.9rem); line-height: 1.25; text-wrap: balance; font-family: Lato, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #cop .cop-logo { margin-right: auto; display: block; }
    #cop .cop-logo img { height: 48px; width: auto; display: block; }
    @media (max-width: 600px) { #cop .cop-logo img { height: 38px; } }
    #cop .cop-skip.show { display: inline-block; }
    #cop-overlay { position: fixed; inset: 0; background: rgba(20,25,35,.55); display: none; align-items: center; justify-content: center; z-index: 9000; padding: 16px; }
    #cop-overlay.show { display: flex; }
    #cop-overlay .cop-modal { background: #fff; color: #1f2a37; border-radius: 20px; padding: 28px 24px; max-width: 420px; width: 100%; text-align: center; animation: cop-pop .35s ease-out; font-family: system-ui, sans-serif; }
    #cop-overlay .cop-modal h2 { margin: 0 0 8px; font-size: 2rem; color: #1a9b5b; }
    #cop-overlay .cop-ghost { background: #e4e5f6; color: #2f3192; }
    @keyframes cop-pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .cop-confetti { position: fixed; top: -30px; font-size: 22px; pointer-events: none; z-index: 9100; animation: cop-fall linear forwards; }
    @keyframes cop-fall { to { transform: translateY(110vh) rotate(540deg); } }
  </style>
</head>
<body>
  <div id="cop">
    <div class="cop-bar">
      <a class="cop-logo" href="/welcome"><img src="/brand/mathify-logo-horizontal.svg?v=bd13eab71a" alt="Mathify" width="175" height="48"></a>
      <a class="cop-login" href="/app/">Login</a>
      <button type="button" class="cop-icon" id="cop-shuffle" aria-label="Shuffle" title="Shuffle">↻</button>
      <a class="cop-icon cop-skip" id="cop-skip" href="/welcome" aria-label="Continue" title="Continue">→</a>
      <span id="cop-msg" hidden></span>
    </div>
    <h1 class="cop-title">Try this small aptitude test!</h1>
    <p class="cop-skipline"><a href="/welcome">Skip the test and go to the website →</a></p>
    <div id="cop-stage">
      <div id="cop-scatter"></div>
      <div id="cop-slots"></div>
    </div>
  </div>

  <div id="cop-overlay" role="dialog" aria-modal="true" aria-label="Puzzle solved">
    <div class="cop-modal">
      <h2>🎉🎉🎉🎉🎉</h2>
      <p id="cop-successText" hidden></p>
      <a class="cop-icon" id="cop-enter" href="/welcome" aria-label="Enter" title="Enter">→</a>
      <button type="button" class="cop-icon cop-ghost" id="cop-again" aria-label="Play again" title="Play again">↻</button>
    </div>
  </div>

  <script src="/assets/puzzle.js?v=cd90c59944"></script>
</body>
</html>
