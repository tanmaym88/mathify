name = "mathify"
compatibility_date = "2026-06-01"
pages_build_output_dir = "public"

# Database (Cloudflare D1). Switched off until the database exists, so the website can deploy now.
# To switch on: create a D1 database named "mathify", then remove the "# " from the 5 lines below
# and paste its Database ID.
# [[d1_databases]]
# binding = "DB"
# database_name = "mathify"
# database_id = "PASTE_DATABASE_ID_HERE"
# migrations_dir = "migrations"

[vars]
# Comma-separated Google emails that get the admin dashboard.
ADMIN_EMAILS = "tanmaym88@gmail.com"
# WhatsApp number used on invoices / reminders (digits only, with country code).
BUSINESS_WHATSAPP = "919766072237"
BUSINESS_EMAIL = "tanmaym88@gmail.com"

# Secrets (NOT in this file). Set them in Cloudflare → Pages → Settings → Variables and secrets,
# or locally in .dev.vars:
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   SESSION_SECRET   (any long random string)
